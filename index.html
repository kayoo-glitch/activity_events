<!DOCTYPE html>
<html lang="en">
<head>
    <script src="resources/jquery-4.0.0.js"></script>
    <src="resources/jquery.min.js">
    <!--
    fallback script that will uses jQuery CDN if local file fails
    -->
    <script>
        if (typeof jQuery === "undefined") {
            console.log("local file has failed, fallback script will start.");
            document.write('<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"><\/script>');
        } else {
            console.log("local file is successful.");
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/jquery-validation@1.22.1/dist/jquery.validate.min.js"></script>
    <script>
    $(document).ready(function(){
        $("p").on({
            mouseenter: function(){
                $(this).css("color", "red");
            },
            mouseleave: function(){
                $(this).css("color", "black");
            }
        });
    });
    </script>
    <script>
        $(document).ready(function(){
            $("#btn1").click(function(){
                $("#shape").animate({height: "100px"});
            });
            $(document).ready(function(){
            $("#btn2").click(function(){
                $("#shape").animate({height: "300px"});
            });
            $(document).ready(function(){
            $("#btn3").click(function(){
                $("#shape").animate({height: "500px"});
            });
        });
    </script>

    <script>
        $(document).ready(function(){
            $(".btn4").click(function(){
                $("p").fadeIn();
            });
            $(".btn5").click(function(){
                $("p").fadeOut();
            });
        })
    </script>
</head>
<body>
    <h1>Using jQuery Selectors and Events</h1>
    <p>
        This will turn the paragraph red if your mouse is over it.
    </p>
    
    <button id="btn1">Regular height</button>
    <button id="btn2">Medium height</button>
    <button id="btn3">Max height</button>
    <div id="box" style="background:red;height:100px;width:100px;margin:6px;"></div>

    <button id="btn4">reappear</button>
    <button id="btn5">disappear</button>
    <p>
        This will make the paragraphs disappear if your mouse is over it.
    </p>
</body>
</html>
